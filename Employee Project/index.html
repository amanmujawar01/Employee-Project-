<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Salimkhan Pathan — Data Analyst</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  :root{
    --bg: #060B18;
    --bg-2: #0A1224;
    --glass: rgba(16,24,46,0.55);
    --glass-border: rgba(96,165,250,0.22);
    --cyan: #45D8F0;
    --blue: #5B8CFF;
    --pink: #F0518A;
    --text: #E8ECF7;
    --text-soft: #93A0C2;
    --line: rgba(148,163,196,0.14);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family:'Inter', sans-serif;
    scroll-behavior:smooth;
  }

  #root{ position:relative; overflow-x:hidden; }

  h1,h2,h3{
    font-family:'Sora', sans-serif;
    margin:0;
    color: var(--text);
  }
  .mono{ font-family:'JetBrains Mono', monospace; }

  .wrap{ max-width: 1080px; margin:0 auto; padding: 0 28px; position:relative; z-index:2; }

  /* background glow blobs */
  .glow{
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    z-index:0;
    pointer-events:none;
  }
  .glow.a{ width:520px; height:520px; background: radial-gradient(circle, rgba(69,216,240,0.30), transparent 70%); top:-140px; left:-140px; }
  .glow.b{ width:600px; height:600px; background: radial-gradient(circle, rgba(91,140,255,0.24), transparent 70%); bottom:-200px; right:-160px; }
  .glow.c{ width:400px; height:400px; background: radial-gradient(circle, rgba(240,81,138,0.14), transparent 70%); top:40%; left:50%; }

  /* NAV */
  nav.site{
    position: sticky; top:16px; z-index:30;
    margin: 16px auto 0;
    max-width: 1040px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(14px);
    border-radius: 16px;
  }
  nav.site .inner{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 24px;
  }
  nav.site .brand{ font-family:'Sora',sans-serif; font-weight:700; font-size:1.05rem; letter-spacing:0.2px; }
  nav.site .brand span{ color: var(--cyan); }
  nav.site ul{ list-style:none; display:flex; gap:26px; margin:0; padding:0; }
  nav.site a.nav-link{ color: var(--text-soft); text-decoration:none; font-size:0.9rem; transition:color .15s; }
  nav.site a.nav-link:hover{ color: var(--cyan); }
  .cta-pink{
    background: linear-gradient(135deg, var(--pink), #ff8bb0);
    color:#160a12; font-weight:600; font-size:0.85rem;
    padding: 9px 18px; border-radius: 10px; text-decoration:none;
    box-shadow: 0 6px 20px rgba(240,81,138,0.35);
    white-space:nowrap;
  }
  @media (max-width:760px){ nav.site ul{ display:none; } }

  /* HERO CARD */
  .hero-shell{ padding: 40px 0 80px; }
  .hero-card{
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 48px;
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .hero-top{
    display:grid;
    grid-template-columns: 280px 1fr;
    gap: 48px;
    align-items:center;
  }
  @media (max-width:760px){
    .hero-card{ padding:28px; }
    .hero-top{ grid-template-columns: 1fr; text-align:center; }
  }

  .orbit-wrap{
    position:relative;
    width:240px; height:240px;
    margin: 0 auto;
  }
  .orbit-ring{
    position:absolute; inset:0;
    border-radius:50%;
    border: 1px dashed rgba(69,216,240,0.35);
    animation: spin 18s linear infinite;
  }
  .orbit-ring.two{ inset:-22px; border-color: rgba(91,140,255,0.22); animation-duration: 26s; animation-direction: reverse; }
  @keyframes spin{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }
  .orbit-photo{
    position:absolute; inset:14px;
    border-radius:50%;
    overflow:hidden;
    border: 2px solid rgba(69,216,240,0.5);
    box-shadow: 0 0 40px rgba(69,216,240,0.35), inset 0 0 30px rgba(0,0,0,0.4);
  }
  .orbit-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .orbit-dot{
    position:absolute; width:10px; height:10px; border-radius:50%;
    background: var(--cyan); box-shadow:0 0 10px var(--cyan);
    top:-4px; left:50%;
  }

  .hero-copy .eyebrow{ font-family:'JetBrains Mono',monospace; color: var(--text-soft); font-size:0.95rem; margin-bottom:6px; }
  .hero-copy h1{ font-size: clamp(1.9rem, 4vw, 2.6rem); font-weight:800; line-height:1.15; }
  .hero-copy .role{
    margin-top:8px; font-size:1.2rem; font-weight:600; color: var(--text-soft);
  }
  .hero-copy .role span{ color: var(--cyan); }
  .hero-copy p.desc{
    margin-top:16px; color: var(--text-soft); line-height:1.7; max-width:52ch;
    font-size:0.98rem;
  }
  @media (max-width:760px){ .hero-copy p.desc{ margin-left:auto; margin-right:auto; } }

  .icon-row{ display:flex; gap:12px; margin-top:20px; justify-content:flex-start; }
  @media (max-width:760px){ .icon-row{ justify-content:center; } }
  .icon-row a{
    width:38px; height:38px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--glass-border); color: var(--text-soft);
    text-decoration:none; font-size:0.85rem;
    transition: all .15s;
  }
  .icon-row a:hover{ color: var(--cyan); border-color: var(--cyan); }

  .btn-row{ display:flex; gap:14px; margin-top:26px; }
  @media (max-width:760px){ .btn-row{ justify-content:center; flex-wrap:wrap; } }
  .btn-solid{
    background: linear-gradient(135deg, var(--cyan), var(--blue));
    color:#04101c; font-weight:700; font-size:0.92rem;
    padding: 12px 24px; border-radius:12px; text-decoration:none;
    box-shadow: 0 8px 24px rgba(69,216,240,0.28);
  }
  .btn-outline{
    border:1px solid var(--glass-border); color: var(--text);
    font-size:0.92rem; padding: 12px 24px; border-radius:12px; text-decoration:none;
  }
  .btn-outline:hover{ border-color: var(--cyan); color: var(--cyan); }

  /* stats bar */
  .stats-bar{
    margin-top: 40px;
    display:flex; align-items:center;
    border-top: 1px solid var(--line);
    padding-top: 28px;
    flex-wrap: wrap;
    gap: 20px;
  }
  .stat{ flex:1; min-width:120px; text-align:center; }
  .stat .num{ font-family:'Sora',sans-serif; font-weight:800; font-size:1.5rem; color:var(--text); }
  .stat .num span{ color: var(--cyan); }
  .stat .lbl{ font-size:0.78rem; color: var(--text-soft); margin-top:4px; }
  .stat-divider{ width:1px; height:36px; background: var(--line); }
  @media (max-width:620px){ .stat-divider{ display:none; } }

  /* SECTIONS */
  section{ padding: 60px 0; }
  section .kicker{ font-family:'JetBrains Mono',monospace; font-size:0.8rem; color: var(--cyan); margin-bottom:10px; }
  section h2{ font-size:1.8rem; margin-bottom:30px; }

  .panel{
    background: var(--glass);
    border:1px solid var(--glass-border);
    border-radius:18px;
    padding: 32px;
  }

  .about-body p{ color: var(--text-soft); line-height:1.75; max-width:64ch; font-size:1rem; }

  /* EDUCATION */
  .edu-item{
    display:grid; grid-template-columns:150px 1fr; gap:24px;
    padding:22px 0; border-top:1px solid var(--line);
  }
  .edu-item:first-of-type{ border-top:none; padding-top:0; }
  .edu-item .stamp{ font-family:'JetBrains Mono',monospace; font-size:0.85rem; color:var(--text-soft); }
  .edu-item h3{ font-size:1.1rem; margin-bottom:6px; }
  .edu-item p{ color: var(--text-soft); margin:0; font-size:0.95rem; }
  .edu-item .score{
    display:inline-block; margin-top:8px; font-family:'JetBrains Mono',monospace;
    font-size:0.8rem; color: var(--cyan); background: rgba(69,216,240,0.1);
    padding:3px 10px; border-radius:6px;
  }

  /* SKILLS */
  .skills-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:14px; }
  .skill-chip{
    border:1px solid var(--glass-border); border-radius:10px; padding:14px 16px;
    background: rgba(255,255,255,0.02); font-size:0.92rem;
  }
  .skill-chip .lvl{ display:block; margin-top:10px; height:5px; background: var(--line); border-radius:3px; overflow:hidden; }
  .skill-chip .lvl i{ display:block; height:100%; background: linear-gradient(90deg, var(--cyan), var(--blue)); }
  .note{ margin-top:18px; font-size:0.85rem; color: var(--text-soft); font-style:italic; }

  /* PROJECTS */
  .projects-grid{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  @media (max-width:700px){ .projects-grid{ grid-template-columns:1fr; } }
  .project-card{
    border:1px solid var(--glass-border); border-radius:18px; overflow:hidden;
    background: rgba(255,255,255,0.02);
  }
  .project-visual{
    height:150px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Sora',sans-serif; font-weight:800; font-size:2.2rem; color: rgba(255,255,255,0.85);
    position:relative; overflow:hidden;
  }
  .project-visual.hr{ background: linear-gradient(135deg, rgba(91,140,255,0.35), rgba(69,216,240,0.15)); }
  .project-visual.it{ background: linear-gradient(135deg, rgba(240,81,138,0.30), rgba(91,140,255,0.15)); }
  .project-body{ padding:22px; }
  .project-body .tag{ font-family:'JetBrains Mono',monospace; font-size:0.75rem; color: var(--cyan); }
  .project-body h3{ font-size:1.15rem; margin: 8px 0 10px; }
  .project-body p{ color: var(--text-soft); font-size:0.92rem; line-height:1.6; margin:0; }

  /* CONTACT / FOOTER */
  footer{ padding: 70px 0 50px; }
  .contact-panel{
    display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:28px;
  }
  footer h2{ font-size:1.7rem; margin-bottom:14px; }
  footer p{ color: var(--text-soft); max-width:48ch; line-height:1.65; }
  .footer-links{ display:flex; flex-direction:column; gap:10px; font-family:'JetBrains Mono',monospace; font-size:0.92rem; }
  .footer-links a{ color: var(--text); text-decoration:none; }
  .footer-links a:hover{ color: var(--cyan); }
  .copyright{ margin-top:46px; font-size:0.78rem; color: var(--text-soft); font-family:'JetBrains Mono',monospace; text-align:center; }

  @media (prefers-reduced-motion: reduce){
    .orbit-ring{ animation:none; }
  }
</style>
</head>

function About(){
